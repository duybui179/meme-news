name: Go CI Test

# Kích hoạt khi có push hoặc pull request vào nhánh main
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps: 
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Show Current Branch
          run: |
            echo "Full Ref: ${{ github.ref }}"
            echo "Branch Name: ${{ github.ref_name }}"

            if [ "${{ github.ref_name }}" = "main" ]; then
              echo "This is MAIN"
            else
              echo "This is DEV"
            fi

    # steps:
