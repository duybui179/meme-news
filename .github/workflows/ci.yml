  golang-ci-check:
    name: Run Go Checks on Local Runner
    runs-on: self-hosted          # Chỉ định chạy trên máy local của bạn

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Arch: $RUNNER_ARCH"

      - name: Start test server on port 8080
        run: |
          python3 -m http.server 8080 --bind 0.0.0.0 > server.log 2>&1 &
          echo $! > server.pid
          sleep 2

      - name: Check port is listening
        run: |
          ss -ltnp | grep 8080 || true
          curl -I http://127.0.0.1:8080 || true

      - name: Cleanup
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
          