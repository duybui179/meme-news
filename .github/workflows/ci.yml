  golang-ci-check:
    name: Run Go Checks on Local Runner
    runs-on: self-hosted          # Chỉ định chạy trên máy local của bạn

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # Bước 1: Kiểm tra định dạng code (Format)
      - name: Check Code Formatting
        run: |
          if [ -n "$FORMAT_ISSUES" ]; then
            echo "Các file sau chưa được format đúng chuẩn 'go fmt':"
            echo "$FORMAT_ISSUES"
            exit 1
          fi
          

      # Bước 2: Chạy Go Vet để bắt lỗi logic tĩnh
      - name: Run Go Vet
        run: go vet ./...